<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login / Sign Up</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
      user-select: none;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #e0e0e0;
      padding: 15px;
      /* জুম ও স্ক্রল বন্ধ রাখতে */
      touch-action: pan-x pan-y;
      overflow: hidden;
    }

    /* মূল কন্টেইনার */
    .container {
      position: relative;
      width: 100%;
      max-width: 400px; /* মোবাইলেই সুন্দরভাবে ফিট হবে */
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      min-height: 480px;
    }

    /* ফর্ম ডিজাইন */
    .form-box {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 30px;
      transition: all 0.5s ease-in-out;
    }

    .form-box h2 {
      font-size: 28px;
      color: #333;
      text-align: center;
      margin-bottom: 20px;
      font-weight: 700;
    }

    .input-box {
      position: relative;
      margin: 15px 0;
      border-bottom: 2px solid #ccc;
    }

    .input-box input {
      width: 100%;
      padding: 10px 35px 10px 10px;
      background: transparent;
      border: none;
      outline: none;
      font-size: 16px;
      color: #333;
    }

    .input-box i {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: #777;
    }

    .btn {
      width: 100%;
      height: 45px;
      background: #000;
      border: none;
      outline: none;
      border-radius: 25px;
      cursor: pointer;
      font-size: 16px;
      color: #fff;
      font-weight: 600;
      margin-top: 15px;
      transition: background 0.3s;
    }

    .toggle-text {
      font-size: 14px;
      text-align: center;
      margin-top: 20px;
      color: #666;
    }

    .toggle-text a {
      color: #000;
      text-decoration: none;
      font-weight: 600;
    }

    /* ব্যাকগ্রাউন্ড ডায়াগোনাল এনিমেশন শেপ */
    .overlay {
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: #000;
      clip-path: polygon(100% 0, 0 100%, 100% 100%);
      transition: transform 0.6s ease-in-out;
      pointer-events: none;
      display: none; /* আপনার ডিজাইনের সাথে না মিললে এটি বাদ দিতে পারেন */
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="form-box login">
      <h2>Login</h2>
      <form action="#">
        <div class="input-box">
          <input type="text" placeholder="Username" required>
        </div>
        <div class="input-box">
          <input type="password" placeholder="Password" required>
        </div>
        <button type="submit" class="btn">Login</button>
        <div class="toggle-text">
          <p>Don't have an account? <a href="#">Sign Up</a></p>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
