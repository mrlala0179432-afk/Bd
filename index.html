<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Login & Sign Up</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="wrapper">
    <span class="bg-animate"></span>
    <span class="bg-animate2"></span>

    <div class="form-box login">
      <h2 class="animation">Login</h2>
      <form action="#">
        <div class="input-box animation">
          <input type="text" required>
          <label>Username</label>
          <i class='bx bxs-user'></i>
        </div>
        <div class="input-box animation">
          <input type="password" required>
          <label>Password</label>
          <i class='bx bxs-lock-alt'></i>
        </div>
        <button type="submit" class="btn animation">Login</button>
        <div class="logreg-link animation">
          <p>Don't have an account? <a href="#" class="register-link">Sign Up</a></p>
        </div>
      </form>
    </div>

    <div class="info-text login">
      <h2 class="animation">WELCOME BACK!</h2>
      <p class="animation">Lorem ipsum dolor sit amet consectetur adipisicing elit. Deleniti, lorem?</p>
    </div>

    <div class="form-box register">
      <h2 class="animation">Sign Up</h2>
      <form action="#">
        <div class="input-box animation">
          <input type="text" required>
          <label>Username</label>
          <i class='bx bxs-user'></i>
        </div>
        <div class="input-box animation">
          <input type="email" required>
          <label>Email</label>
          <i class='bx bxs-envelope'></i>
        </div>
        <div class="input-box animation">
          <input type="password" required>
          <label>Password</label>
          <i class='bx bxs-lock-alt'></i>
        </div>
        <button type="submit" class="btn animation">Sign Up</button>
        <div class="logreg-link animation">
          <p>Already have an account? <a href="#" class="login-link">Login</a></p>
        </div>
      </form>
    </div>

    <div class="info-text register">
      <h2 class="animation">WELCOME BACK!</h2>
      <p class="animation">Lorem ipsum dolor sit amet consectetur adipisicing elit. Deleniti, lorem?</p>
    </div>

  </div>

  <script>
    const wrapper = document.querySelector('.wrapper');
    const registerLink = document.querySelector('.register-link');
    const loginLink = document.querySelector('.login-link');

    registerLink.onclick = () => {
      wrapper.classList.add('active');
    };

    loginLink.onclick = () => {
      wrapper.classList.remove('active');
    };
  </script>
</body>
</html>
